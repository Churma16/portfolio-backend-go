version: "3.8"

services:
  # Service untuk menjalankan migrasi database otomatis sebelum API jalan
  migrate:
    image: migrate/migrate
    volumes:
      - ./db/migration:/migrations
    command:
      - -path=/migrations
      - -database=postgresql://root:secret@postgres:5432/portfolio_go?sslmode=disable
      - -verbose
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio_network

  # 1. Aplikasi Go
  api:
    build: .
    container_name: go_portfolio
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=postgresql://root:secret@postgres:5432/portfolio_go?sslmode=disable
      - REDIS_ADDRESS=redis:6379
      - REDIS_ADDR=redis:6379
      - SERVER_ADDRESS=0.0.0.0:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: always
    networks:
      - portfolio_network
      - my-app_churma-net

  # 2. Database Postgres
  postgres:
    image: postgres:15-alpine
    container_name: go_postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=portfolio_go
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d portfolio_go"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - portfolio_network

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: go_redis
    restart: always
    networks:
      - portfolio_network

volumes:
  postgres_data:

networks:
  portfolio_network:
  my-app_churma-net:
    external: true
