<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Baru dari Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333333;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .header {
            background-color: #17293E;
            padding: 24px;
            text-align: center;
        }

        .header h2 {
            color: #ffffff;
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 32px;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
            color: #1a202c;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .message-box {
            background-color: #f7fafc;
            border-left: 4px solid #328AF1;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 32px;
            color: #4a5568;
            font-style: italic;
        }

        .btn {
            display: inline-block;
            background-color: #328AF1;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2672c7;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a202c;
            }

            .card {
                background-color: #2d3748;
                color: #e2e8f0;
            }

            .value {
                color: #f7fafc;
            }

            .message-box {
                background-color: #283141;
                color: #cbd5e0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h2>Portfolio Inquiry</h2>
        </div>
        <div class="content">
            <div class="label">Dari</div>
            <div class="value">{{ .SenderName }}</div>

            <div class="label">Email Pengirim</div>
            <div class="value"><a href="mailto:{{ .SenderEmail }}" style="color: #328AF1; text-decoration: none;">{{
                .SenderEmail }}</a></div>

            <div class="label">Pesan</div>
            <div class="message-box">
                "{{ .Content }}"
            </div>

            <div style="text-align: center;">
                <a href="mailto:{{ .SenderEmail }}" class="btn">Balas Pesan</a>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2026 Portfolio System. Dikirim via Resend.</p>
    </div>
</div>
</body>
</html>
