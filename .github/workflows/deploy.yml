name: Deploy Backend Go

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build Image and Deploy Go Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Build Application Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o server-app main.go

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/churma16/portfolio-backend-go:${{ github.ref_name }}
            ghcr.io/churma16/portfolio-backend-go:latest

      - name: Activate Service and Verify on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            if [ -d /root/churma-codes/scripts ]; then
              cd /root/churma-codes
              ./scripts/deploy.sh go "ghcr.io/churma16/portfolio-backend-go:${{ github.ref_name }}"
              ./scripts/smoke-test.sh go
            else
              echo "[info] /root/churma-codes not yet found on VPS. Skipping container activation until infra is deployed."
            fi
