name: Migrate Laravel to Go Data

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Build Migration Script
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o migrate-data scripts/migrate_data.go

      - name: Deploy Script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "migrate-data"
          target: "/var/www/go-portfolio-api"
          strip_components: 0

      - name: Execute Migration in Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/go-portfolio-api
            chmod +x migrate-data
            
            # Export environment variables from files to the host shell
            # Hapus karakter \r (carriage return) jika file .env menggunakan format Windows CRLF
            sed -i 's/\r$//' app.env
            sed -i 's/\r$//' /root/my-app/.env
            
            set -a
            source app.env
            source /root/my-app/.env
            set +a
            
            # Menjalankan script menggunakan container api secara temporary
            # Pass variable ke container menggunakan flag -e
            # Kita set DB_HOST=churma-db karena container ini sekarang di-attach ke network Laravel
            docker compose run --rm -T \
              -e MYSQL_DSN -e DB_USERNAME -e DB_PASSWORD -e DB_DATABASE -e DB_HOST=churma-db -e DB_PORT -e DB_SOURCE -e POSTGRES_DSN \
              -v ./migrate-data:/migrate-data \
              api /migrate-data
